<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="review.css" />
  <style>
    body { width: 340px; padding-bottom: 12px; }
    select { width: 100%; background: #1f2630; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .demo { display: block; width: 100%; text-align: left; margin-top: 6px; }
    .status { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="logo">◈</span> SignSense</div><div class="site">Understand it before you sign it</div></header>

  <section class="card">
    <h2>AI mode</h2>
    <select id="mode">
      <option value="prefer_on_device">Balanced: on-device first, cloud fallback</option>
      <option value="only_on_device">Strict privacy: on-device only</option>
      <option value="only_in_cloud">Cloud only</option>
    </select>
    <p class="muted small" id="mode-note"></p>
  </section>

  <section class="card">
    <div class="status"><h2 style="margin:0">On-device model</h2><span class="badge device" id="avail">…</span></div>
    <div class="row"><button class="btn secondary" id="download" hidden>Download Gemini Nano</button></div>
    <div class="progress" id="bar" hidden><div></div></div>
  </section>

  <section class="card">
    <h2>Try a demo request</h2>
    <p class="muted small" style="margin-top:0">No wallet needed. Opens the same review window a real request would.</p>
    <div id="demos"></div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
