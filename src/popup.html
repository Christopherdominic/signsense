<!doctype html>
<html lang="en" class="page-popup">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="review.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"><i class="ico i-shield-check"></i></span>SignSense</div>
    <div class="tagline">Understand it before you sign it</div>
  </header>

  <main>
    <section class="card">
      <h2><i class="ico i-sparkle"></i>AI mode</h2>
      <select id="mode" aria-label="AI mode">
        <option value="prefer_on_device">Balanced: on-device first, cloud fallback</option>
        <option value="only_on_device">Strict privacy: on-device only</option>
        <option value="only_in_cloud">Cloud only</option>
      </select>
      <p class="mode-note" id="mode-note"></p>
    </section>

    <section class="card">
      <h2><i class="ico i-cpu"></i>On-device model</h2>
      <div class="model-row">
        <i class="ico i-bolt"></i>
        <span class="model-name">Gemini Nano<span class="model-sub">Runs privately in Chrome</span></span>
        <span class="badge" id="avail">Checking…</span>
      </div>
      <div class="row"><button class="btn secondary" id="download" hidden>Download Gemini Nano</button></div>
      <div class="progress" id="bar" hidden><div></div></div>
    </section>

    <section class="card">
      <h2><i class="ico i-play"></i>Demo requests</h2>
      <p class="card-note">No wallet needed. Each opens the same review window a real request would.</p>
      <div class="demo-list" id="demos"></div>
    </section>
  </main>

  <footer class="popup-foot">Risk checks run locally. Your wallet address is never sent to the cloud.</footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
